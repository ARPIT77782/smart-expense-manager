{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div class="page-title">Add Expense</div>
    <div class="page-subtitle">Record a new expense</div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="form-card">
            <form method="POST">
                <div class="mb-3">
                    <label class="custom-label">Amount (₹)</label>
                    <input type="number" name="amount" step="0.01" class="custom-input" placeholder="Enter amount" required>
                </div>
                <div class="mb-3">
                    <label class="custom-label">Category</label>
                    <select name="category" class="custom-input" required>
                        <option value="">Select category</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills & Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health & Medical</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="custom-label">Date</label>
                    <input type="date" name="date" class="custom-input" required>
                </div>
                <div class="mb-4">
                    <label class="custom-label">Description (optional)</label>
                    <input type="text" name="description" class="custom-input" placeholder="e.g. Lunch at cafeteria">
                </div>
                <button type="submit" class="btn-teal w-100" style="justify-content:center; padding:12px;">
                    <i class="ti ti-plus"></i> Add Expense
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
