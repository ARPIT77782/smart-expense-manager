<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
   <nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">💰 Smart Expense Manager</a>
        <div>
            {% if session.get('user_id') %}
                <a href="/dashboard" class="btn btn-light btn-sm me-2">Dashboard</a>
                <a href="/add-expense" class="btn btn-light btn-sm me-2">Add Expense</a>
                <a href="/expenses" class="btn btn-light btn-sm me-2">View Expenses</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-light btn-sm me-2">Login</a>
                <a href="/register" class="btn btn-outline-light btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

    <!-- Page Content Goes Here -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
